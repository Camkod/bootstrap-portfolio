<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JSON-datan käsittelyä</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Portfolion oma CSS -->
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <!-- Navigaatio -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Camilla</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Portfolio</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="index.html">JSON</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>


  <main class="container my-5">

    <!-- JSON-data tulee myöhemmin tähän -->
    <div id="vastaus"></div>

  </main>
  <script>

// Haetaan oma JSON-tietue
fetch('tietue.JSON')

// Muunnetaan vastaus JS olio muotoon
.then(function (response) {
    return response.json();
})

// Käsitellään muunnettu JSON-vastaus
// ja kutsutaan funktiota kerro()
.then(function (responseJson) {
    kerro(responseJson);
})

// Jos hakemisessa tuli jokin virhe
.catch(function (error) {
    document.getElementById("vastaus").innerHTML =
        "<p>Tietoa ei pystytä hakemaan</p>";
});


// Määritellään kerro-funktio
function kerro(obj) {

    // Haetaan JSON-tiedostosta otsikko ja kuvaus
    let tiedot =
        "<h1>" + obj.otsikko + "</h1><br>" +
        obj.kuvaus +
        "<br><hr>";

    // Lisätään kuva
    tiedot +=
        "<p><img src='" + obj.kuva +
        "' class='img-fluid' alt='Opintojakson kuva'></p>";

    // Lisätään opintojakson tiedot
    tiedot +=
        "<h3>Opintojakso</h3>" +
        "Nimi: " + obj.opintojakso.nimi + "<br>" +
        "Tunnus: " + obj.opintojakso.tunnus + "<br>" +
        "Opintopisteet: " + obj.opintojakso.opintopisteet + "<br>";

    // Lisätään Aiheet-otsikko
    tiedot += "<p><h3>Aiheet</h3>";

    // Haetaan tekniikat-taulukon tiedot
    for (var i = 0; i < obj.tekniikat.length; i++) {

        tiedot +=
            "<b>Aihe: " + obj.tekniikat[i].aihe + "</b> ";

        tiedot +=
            "<a href='" + obj.tekniikat[i].linkki +
            "'>" + obj.tekniikat[i].linkki + "</a><br>";
    }

    // Suljetaan kappale ja kirjoitetaan tiedot sivulle
    tiedot += "</p>";

    document.getElementById("vastaus").innerHTML = tiedot;
}

</script>


  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
