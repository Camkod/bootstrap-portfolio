<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pokemon haku</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Oma CSS -->
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <!-- Navigaatio -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Camilla</a>

      <div class="navbar-nav">
        <a class="nav-link" href="../index.html">Portfolio</a>
        <a class="nav-link" href="index.html">JSON</a>
        <a class="nav-link" href="toteutus.html">Toteutus</a>
        <a class="nav-link active" href="poke.html">Pokemon haku</a>
      </div>
    </div>
  </nav>


  <main class="container my-5">

    <h1>Pokemon haku</h1>

    <p>
      <input type="text"
             id="pokemonName"
             placeholder="Enter Pokemon name">

      <button onclick="poke()">Hae</button>

      <div id="nimi">Kirjoita laatikkoon Pokemonin nimi</div>

      <p id="kuva2"></p>
    
    <div id="kaanna"></div>
<div id="ominaisuudet"></div>
    
    </p>

  </main>


  <script>
    let pokemonData;

    // Funktio suoritetaan, kun Hae-painiketta painetaan
    function poke() {

      // Tallennetaan annettu Pokemonin nimi
      // ja muutetaan se pieniksi kirjaimiksi
      const pokeName =
        document.getElementById("pokemonName").value.toLowerCase();

      // Tallennetaan nimi myös näytettäväksi sivulle
      let name =
        document.getElementById("pokemonName").value;


      // Haetaan Pokemonin tiedot PokeAPIsta
      fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)

        // Muunnetaan vastaus JSON-muotoon
        .then(function (response) {
          return response.json();
        })

        // Käsitellään JSON-vastaus
        .then(function (responseJson) {
          pokekuva(responseJson, name);
        })

        // Jos haussa tulee virhe
       .catch(function (error) {
  document.getElementById("nimi").innerHTML =
    "Tietoa ei pystytä hakemaan";

  document.getElementById("kuva2").innerHTML = "";
  document.getElementById("kaanna").innerHTML = "";
  document.getElementById("ominaisuudet").innerHTML = "";
  document.getElementById("pokemonName").value = "";
});
    }


    // Näytetään Pokemonin nimi ja kuva
  function pokekuva(obj, name) {

  // Haetaan Pokemonin etukuva
  let pokeurl = obj.sprites.front_default;

  // Kirjoitetaan kuva sivulle
  document.getElementById("kuva2").innerHTML =
    "<img src='" + pokeurl + "' alt='Pokemon'>";

  // Kirjoitetaan Pokemonin nimi sivulle
  document.getElementById("nimi").innerHTML =
    "<b>" + name + "</b>";

  // Lisätään Käännä-painike vasta onnistuneen haun jälkeen
  document.getElementById("kaanna").innerHTML =
    "<button onclick='kaanna()'>Käännä</button>";

  // Tallennetaan Pokemonin tiedot myöhempää käyttöä varten
  pokemonData = obj;

  // Tyhjennetään mahdolliset vanhat ominaisuudet
  document.getElementById("ominaisuudet").innerHTML = "";

  // Tyhjennetään hakukenttä
  document.getElementById("pokemonName").value = "";
}
function kaanna() {

  // Haetaan Pokemonin selkäpuolen kuva
  let takakuva = pokemonData.sprites.back_default;

  // Vaihdetaan etukuva selkäpuolen kuvaksi
  document.getElementById("kuva2").innerHTML =
    "<img src='" + takakuva + "' alt='Pokemon selin'>";

  // Näytetään kolme muuta ominaisuutta
  document.getElementById("ominaisuudet").innerHTML =
    "<h3>Pokemonin tiedot</h3>" +
    "Pituus: " + pokemonData.height + "<br>" +
    "Paino: " + pokemonData.weight + "<br>" +
    "Kokemuspisteet: " + pokemonData.base_experience;
}
  </script>


  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
